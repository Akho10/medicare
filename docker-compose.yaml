version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - fullstack-net

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "4200:4200"
    networks:
      - fullstack-net

networks:
  fullstack-net:
    driver: bridge