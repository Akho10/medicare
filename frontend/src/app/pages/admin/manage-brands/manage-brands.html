<div class="container py-4">

  <h2 class="mb-4">Manage Brands</h2>

  <div *ngIf="message" class="alert alert-success">
    {{ message }}
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>


    <!-- Search Brands -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h5>Search Brands</h5>

      <form (ngSubmit)="searchBrand()" class="d-flex gap-2">
        <input
          type="text"
          class="form-control"
          name="searchName"
          placeholder="Enter brand name"
          [(ngModel)]="searchName">

        <button type="submit" class="btn btn-outline-primary">
          Search
        </button>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="searchName = ''; loadBrands(); errorMessage = ''">
          Reset
        </button>
      </form>
    </div>
  </div>

  <!-- Brand List -->
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      All Brands
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of brands">
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
            <td>
              <button
                class="btn btn-sm btn-danger"
                type="button"
                (click)="deleteBrand(item.id!)">
                Delete
              </button>
            </td>
          </tr>

          <tr *ngIf="brands.length === 0">
            <td colspan="4" class="text-center py-3">
              No brands to display.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <br><br>
  <!-- Add Brand -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      Add New Brand
    </div>

    <div class="card-body">
      <form (ngSubmit)="addBrand()" #brandForm="ngForm">

        <div class="mb-3">
          <label for="name" class="form-label">Brand Name</label>
          <input
            id="name"
            type="text"
            class="form-control"
            name="name"
            [(ngModel)]="brand.name"
            required>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea
            id="description"
            class="form-control"
            name="description"
            rows="3"
            [(ngModel)]="brand.description">
          </textarea>
        </div>

        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="brandForm.invalid">
          Add Brand
        </button>

      </form>
    </div>
  </div>


  </div>

</div>
