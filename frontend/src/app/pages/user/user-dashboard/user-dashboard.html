<div class="container py-4">

    <header class="dashboard-header">
        <div class="mb-4">
            <h1>Welcome back,  {{ userName }}!</h1>
            <p class="text-muted">Your healthcare in one place</p>
        </div>
    </header>

    <div class="row g-4">

        <div class="col-md-6 col-lg-4">
            <div class="card" h-100 shadow-sm>
                <div class="card-body">
                    <h5 class="card-title">Browse Medicines</h5>
                    <p class="card-text">Search avaialble medicines</p>
                    <a routerLink="/medicines" class="btn btn-primary">Browse</a>

                </div>
            </div>

        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card" h-100 shadow-sm>
                <div class="card-body">
                    <h5 class="card-title">My Prescriptions</h5>
                    <p class="card-text">Check prescription status</p>
                    <a routerLink="/my-prescriptions" class="btn btn-primary">Browse</a>

                </div>
            </div>

        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card" h-100 shadow-sm>
                <div class="card-body">
                    <h5 class="card-title">My Orders</h5>
                    <p class="card-text">View your orders</p>
                    <a routerLink="/my-orders" class="btn btn-primary">View</a>

                </div>
            </div>

        </div>

        <div class="col-md-6 col-lg-4">
            <div class="card" h-100 shadow-sm>
                <div class="card-body">
                    <h5 class="card-title">My Profile</h5>
                    <p class="card-text">Manage your details.</p>
                    <a routerLink="/user-profile" class="btn btn-primary">Manage</a>

                </div>
            </div>

        </div>
    </div>
</div>
