<div class="container py-5">
    <div class="row justify-content-center">
        <div class col-md-7 col-lg-6>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center fw-bold mb-2">Admin Registration

                    </h2>

                    <form #registerForm="ngForm" (ngSubmit)="register()">

                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" id="firstName" name="firstName" class="form-control"
                                [(ngModel)]="firstName" required maxlength="50"
                                autocomplete="given-name" placeholder="Enter first name">
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" id="lastName" name="lastName" class="form-control"
                                [(ngModel)]="lastName" required maxlength="50"
                                autocomplete="family-name" placeholder="Enter last name ">

                        
                        </div>

                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" [(ngModel)]="email"
                               required maxlength="50" autocomplete="email"
                                placeholder="Enter email address">

                    

                        </div>

                                 <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control" [(ngModel)]="password"
                                required minlength="8" autocomplete="new-password"
                                placeholder="Enter password">
                                <small class="text-secondary">Use at least 8 characters.</small>

                           
                        </div>

                        <p class="error-message" *ngIf="errorMessage">{{errorMessage}}</p>
                        <p class="success-message" *ngIf="successMessage">{{successMessage}}</p>

                        <button type="submit" class="btn vbtn-prmary w-100" [disabled]="registerForm.invalid || loading"> {{loading ? 'Registering...' : 'Register Admin'}}</button>

                        

                    </form>
                    <p class="text-center mt-4 mb-0">Already registered? <a routerLink="/admin-login" class="text-primary fw-semibold">Log in here</a></p>
                   
                </div>
            </div>
        </div>
    </div>
</div>
