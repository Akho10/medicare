<div class="login-container">
    <div class="login-card">
        <h2>Admin Login</h2>

        <form (ngSubmit)="onLogin()" #loginForm="ngForm">

            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required email/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" placeholder="Enter your password" required/>
            </div>

            <p class="error-message" *ngIf="errorMessage">{{errorMessage}}</p>

               <button type="submit" [disabled]="loginForm.invalid || loading"> {{loading ? 'Logging in...' : 'Login'}}</button>

        </form>

        <p class="register-link">Dont have admin account?<a routerLink="/admin-register">Register here</a></p>
    </div>
    
</div>
